description="mise runtime manager for per-project tool versions"
platforms="mac linux"
deps=""
default="off"
# The module ships a settings fragment and relies on setup.sh to create the
# global configuration file mise writes to, so the probe checks the binary, the
# stowed fragment, and that file.
probe='command -v mise >/dev/null && test -L "${XDG_CONFIG_HOME:-$HOME/.config}/mise/conf.d/00-dotfiles.toml" && test -f "${XDG_CONFIG_HOME:-$HOME/.config}/mise/config.toml"'
