description="Archive creation and extraction tools"
platforms="mac linux"
deps=""
default="off"
probe='command -v zip >/dev/null && command -v unzip >/dev/null && command -v zstd >/dev/null && command -v ouch >/dev/null && command -v bzip2 >/dev/null && { command -v 7z >/dev/null || command -v 7zz >/dev/null; } && command -v tar >/dev/null && command -v rar >/dev/null && command -v unrar >/dev/null'
