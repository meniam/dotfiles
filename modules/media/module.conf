description="Command-line tools for inspecting, converting, and previewing media files"
platforms="mac linux"
deps=""
default="off"
# Three checks are platform-specific: LibreOffice is a macOS cask, the EPUB
# thumbnailer is packaged for Debian and Ubuntu only, and ImageMagick 7 answers
# to `magick` while the ImageMagick 6 builds on Linux still use `convert`.
probe='command -v ffmpeg >/dev/null && command -v ffprobe >/dev/null && { command -v magick >/dev/null || command -v convert >/dev/null; } && command -v gs >/dev/null && command -v rsvg-convert >/dev/null && command -v mediainfo >/dev/null && command -v exiftool >/dev/null && command -v pdftoppm >/dev/null && command -v qpdf >/dev/null && command -v pandoc >/dev/null && command -v chafa >/dev/null && command -v heif-convert >/dev/null && command -v cwebp >/dev/null && command -v tesseract >/dev/null && command -v sox >/dev/null && command -v yt-dlp >/dev/null && { [ "$(uname -s)" != Darwin ] || command -v soffice >/dev/null; } && { [ "$(uname -s)" = Darwin ] || command -v gnome-epub-thumbnailer >/dev/null; }'
