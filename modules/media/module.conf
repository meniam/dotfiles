description="Command-line tools for inspecting, converting, and previewing media files"
platforms="mac linux"
deps=""
default="off"
probe="command -v ffmpeg >/dev/null && (command -v magick >/dev/null || command -v convert >/dev/null) && command -v mediainfo >/dev/null && command -v exiftool >/dev/null && command -v pdftoppm >/dev/null && command -v chafa >/dev/null"
