description="Cross-platform baseline command-line tools, including fzf, direnv, and btop"
platforms="mac linux"
deps=""
default="on"
# tealdeer only reaches Debian/Ubuntu from trixie onwards, so `tldr` is required
# on macOS and optional on Linux.
probe='command -v wget >/dev/null && command -v curl >/dev/null && command -v gpg >/dev/null && command -v rsync >/dev/null && command -v mosh >/dev/null && command -v htop >/dev/null && command -v btop >/dev/null && command -v pv >/dev/null && command -v screen >/dev/null && command -v micro >/dev/null && command -v make >/dev/null && command -v just >/dev/null && command -v direnv >/dev/null && command -v fzf >/dev/null && { [ "$(uname -s)" = Darwin ] || test -f /etc/ssl/certs/ca-certificates.crt; } && { [ "$(uname -s)" != Darwin ] || command -v tldr >/dev/null; }'
