description="Debian/Ubuntu-specific command-line tools and build prerequisites"
platforms="linux"
deps="must-have"
default="on"
probe="command -v pydf >/dev/null && command -v lsb_release >/dev/null && command -v update-ca-certificates >/dev/null && command -v apt-ftparchive >/dev/null && command -v openssl >/dev/null && command -v gpg >/dev/null && command -v pkg-config >/dev/null && command -v sudo >/dev/null && command -v cc >/dev/null && command -v make >/dev/null && infocmp xterm-kitty >/dev/null 2>&1"
