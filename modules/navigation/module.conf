description="Terminal navigation, file discovery, and file workflow tools"
platforms="mac linux"
deps=""
default="off"
probe='command -v eza >/dev/null && { command -v fd >/dev/null || command -v fdfind >/dev/null; } && command -v rg >/dev/null && command -v fzf >/dev/null && command -v peco >/dev/null && command -v tree >/dev/null && command -v file >/dev/null && { command -v bat >/dev/null || command -v batcat >/dev/null; } && command -v stow >/dev/null && command -v entr >/dev/null && command -v glow >/dev/null && command -v jq >/dev/null && command -v yq >/dev/null && command -v parallel >/dev/null && { [ "$(uname -s)" = Darwin ] || command -v fasd >/dev/null; }'
