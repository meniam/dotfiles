description="Rust stable toolchain with rustup, Clippy, rustfmt, rust-analyzer, and the cargo tools"
platforms="mac linux"
deps=""
default="off"
# Everything lands in ~/.cargo/bin, which is not on the installer's PATH, so the
# probe prepends it. The binaries are run rather than merely stat'ed: a
# half-installed toolchain leaves the files in place but cannot report a
# version. cargo-edit is checked through cargo-upgrade, the command it provides.
probe='PATH="${CARGO_HOME:-$HOME/.cargo}/bin:$PATH"; command -v rustup >/dev/null && rustc --version >/dev/null 2>&1 && cargo --version >/dev/null 2>&1 && rustup component list --installed 2>/dev/null | grep -q "^clippy" && rustup component list --installed 2>/dev/null | grep -q "^rustfmt" && rustup component list --installed 2>/dev/null | grep -q "^rust-analyzer" && command -v cargo-binstall >/dev/null && command -v cargo-nextest >/dev/null && command -v cargo-audit >/dev/null && command -v cargo-upgrade >/dev/null && command -v sccache >/dev/null'
