#:schema https://yazi-rs.github.io/schemas/yazi.json

[mgr]
ratio          = [1, 3, 3]
sort_by        = "alphabetical"
sort_sensitive = false
sort_reverse   = false
sort_dir_first = true
sort_translit  = false
linemode       = "size"
show_hidden    = true
show_symlink   = true
scrolloff      = 5
mouse_events   = ["click", "scroll"]
title_format   = "Yazi: {cwd}"

[preview]
wrap           = "no"
tab_size       = 2
max_width      = 3600
max_height     = 3600
cache_dir      = ""
image_delay    = 30
image_filter   = "triangle"
image_quality  = 75
sixel_fraction = 15
ueberzug_scale = 1
ueberzug_offset = [0, 0, 0, 0]

[opener]
# `edit` is Yazi's built-in opener and runs $EDITOR, which the zsh module
# points at Neovim. It is listed first everywhere below so a machine without a
# graphical editor still opens files.
#
# `code` is only reachable when VS Code's shell command is on PATH; no module
# installs it, so the entry stays as an optional second choice rather than the
# default it used to be.
vscode = [
	{ run = 'code "$@"', desc = "VS Code", orphan = true, for = "unix" },
]

# Terminal editors, offered alongside `edit` ($EDITOR) as alternatives in the
# `open --interactive` picker.
micro = [
	{ run = 'micro "$@"', desc = "micro", block = true, for = "unix" },
]

mcedit = [
	{ run = 'mcedit "$@"', desc = "mcedit", block = true, for = "unix" },
]

nvim = [
	{ run = 'nvim "$@"', desc = "nvim", block = true, for = "unix" },
]

[open]
prepend_rules = [
	{ url = "*/", use = ["open", "edit", "vscode", "reveal"] },
	{ url = "*.md", use = ["open", "edit", "micro", "mcedit", "nvim", "vscode", "reveal"] },
	{ mime = "text/html", use = ["open", "edit", "micro", "mcedit", "nvim", "vscode", "reveal"] },
	{ mime = "text/*", use = ["open", "edit", "micro", "mcedit", "nvim", "vscode", "reveal"] },
	{ mime = "application/{json,ndjson,javascript,wine-extension-ini}", use = ["open", "edit", "micro", "mcedit", "nvim", "vscode", "reveal"] },
]

[plugin]
# Preloaders have a hard limit of 16 rules across built-in and custom rules. Group extensions with {a,b,c}.
prepend_preloaders = [
	{ mime = "{audio,video,image}/*", run = "mediainfo" },
	{ mime = "application/subrip", run = "mediainfo" },

	{ url = "*.{csv,tsv,json,parquet,txt,xlsx}", run = "duckdb", multi = false },

	{ mime = "application/{vnd.openxmlformats-officedocument.*,openxmlformats-officedocument.*,vnd.oasis.opendocument.*,oasis.opendocument.*,ms-*,msword}", run = "office" },
	{ url = "*.docx", run = "office" },

	{ url = "*.epub", run = "preview-epub" },

	{ url = "*.cb{z,r}", run = "preview-cbz" },
	{ url = "*.typ", run = "preview-typst" },
	{ url = "*.yuv", run = "yuv" },
]

prepend_previewers = [
	# Narrow formats come before archive and text rules so broader matchers do not claim them.
	{ url = "*.txt.gz", run = "zless-preview" },
	{ url = "*.{djvu,djv}", run = "djvu-view" },
	{ url = "*.{pkl,pickle}", run = "pickle" },
	{ url = "*.cb{z,r}", run = "preview-cbz" },
	{ url = "*.typ", run = "preview-typst" },
	{ url = "*.yuv", run = "yuv" },
	{ mime = "image/x-xcursor", run = "xcursor-preview" },
	{ url = "**/.git/", run = "preview-git" },

	# Archives use ouch instead of lsar. Keep lsar available as an alternative if needed.
	{ mime = "application/{*zip,tar,bzip2,7z*,rar,xz,zstd,java-archive}", run = "ouch" },

	# Media replaces the built-in image and video previewers.
	{ mime = "{audio,video,image}/*", run = "mediainfo" },
	{ mime = "application/subrip", run = "mediainfo" },

	# Markdown and Mermaid go through the vendored myazin-mermaid-glow previewer,
	# which swaps every mermaid fence for ASCII art and pipes the document
	# through glow. mdcat stays locked in package.toml as an alternative but is
	# not enabled.
	{ url = "*.md", run = "myazin-mermaid-glow" },
	{ url = "*.mmd", run = "myazin-mermaid-glow" },
	{ url = "*.mermaid", run = "myazin-mermaid-glow" },

	# Tabular data uses DuckDB; parquet-preview and rich-preview are locked in
	# package.toml as alternatives but not enabled. miller is deliberately not
	# among them: its upstream still ships the pre-0.3 `init.lua` layout, which
	# `ya pkg` cannot deploy. The `mlr` binary is installed and usable directly.
	{ url = "*.csv", run = "duckdb" },
	{ url = "*.tsv", run = "duckdb" },
	{ url = "*.parquet", run = "duckdb" },
	{ url = "*.txt", run = "duckdb" },
	{ url = "*.xlsx", run = "duckdb" },
	{ url = "*.db", run = "duckdb" },
	{ url = "*.duckdb", run = "duckdb" },

	# SQLite database schema
	{ url = "*.sqlite3", run = "preview-sqlite" },
	{ mime = "application/sqlite3", run = "preview-sqlite" },

	# Office documents
	{ mime = "application/{vnd.openxmlformats-officedocument.*,openxmlformats-officedocument.*,vnd.oasis.opendocument.*,oasis.opendocument.*,ms-*,msword}", run = "office" },
	{ url = "*.docx", run = "office" },

	# EPUB cover preview
	{ url = "*.epub", run = "preview-epub" },

	# Jupyter notebooks
	{ url = "*.ipynb", run = "nbpreview" },

	# Torrent files
	{ mime = "application/bittorrent", run = "torrent-preview" },

	# Directories use eza instead of the built-in folder previewer; press e then t to switch tree/list mode.
	{ url = "*/", run = "eza-preview" },

	# Text uses a Git gutter preview after Markdown, CSV, and plain-text rules
	# have been handled. This plugin is vendored under plugins/ rather than
	# locked in package.toml — it has no public upstream to fetch it from.
	{ mime = "text/*", run = "vscode-git-gutter" },
]

append_previewers = [
	# Universal hex fallback has low priority and does not replace specialized previewers above.
	{ url = "*", run = "hexyl" },
]
