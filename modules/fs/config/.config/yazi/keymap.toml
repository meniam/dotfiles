# tab switch (["]"→ х/ъ, "{"/"}"→ Х/Ъ)
[[mgr.prepend_keymap]]
on = "х"
run = "tab_switch -1 --relative"
desc = "Previous tab"

[[mgr.prepend_keymap]]
on = "ъ"
run = "tab_switch 1 --relative"
desc = "Next tab"

[[mgr.prepend_keymap]]
on = "Х"
run = "tab_swap -1"
desc = "Swap with previous tab"

[[mgr.prepend_keymap]]
on = "Ъ"
run = "tab_swap 1"
desc = "Swap with next tab"
