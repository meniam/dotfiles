# eza-preview.yazi: directory tree preview controls
[[mgr.prepend_keymap]]
on = ["e", "t"]
run = "plugin eza-preview"
desc = "Toggle tree/list dir preview"

[[mgr.prepend_keymap]]
on = ["e", "-"]
run = "plugin eza-preview inc-level"
desc = "Increment tree level"

[[mgr.prepend_keymap]]
on = ["e", "_"]
run = "plugin eza-preview dec-level"
desc = "Decrement tree level"

[[mgr.prepend_keymap]]
on = ["e", "$"]
run = "plugin eza-preview toggle-follow-symlinks"
desc = "Toggle tree follow symlinks"

[[mgr.prepend_keymap]]
on = ["e", "*"]
run = "plugin eza-preview toggle-hidden"
desc = "Toggle hidden files"

[[mgr.prepend_keymap]]
on = ["e", "g", "i"]
run = "plugin eza-preview toggle-git-ignore"
desc = "Toggle .gitignore files"

[[mgr.prepend_keymap]]
on = ["e", "g", "s"]
run = "plugin eza-preview toggle-git-status"
desc = "Toggle showing git status"

[[mgr.prepend_keymap]]
on = ["у", "е"]
run = "plugin eza-preview"
desc = "Toggle tree/list dir preview"

[[mgr.prepend_keymap]]
on = ["у", "п", "ш"]
run = "plugin eza-preview toggle-git-ignore"
desc = "Toggle .gitignore files"

[[mgr.prepend_keymap]]
on = ["у", "п", "ы"]
run = "plugin eza-preview toggle-git-status"
desc = "Toggle showing git status"

# Duplicate [mgr] bindings for the Russian keyboard layout: the same physical keys.
# Punctuation is omitted because it either matches Latin keys through AltGr or conflicts with another binding.

