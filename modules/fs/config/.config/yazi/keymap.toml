desc = "Swap with next tab"

# autosave.yazi: persist the tab session (~/.local/state/yazi/session.json).
# Restored on startup by init.lua; these override the defaults so that every
# action that changes the tab set or the cwd writes the session out.

[[mgr.prepend_keymap]]
on = "q"
run = ["plugin autosave", "quit"]
desc = "Quit"

[[mgr.prepend_keymap]]
on = "Q"
run = ["plugin autosave", "quit --no-cwd-file"]
desc = "Quit without writing the cwd file"

[[mgr.prepend_keymap]]
on = "<C-q>"
run = ["plugin autosave", "quit"]
desc = "Quit"

[[mgr.prepend_keymap]]
on = "l"
run = ["enter", "plugin autosave"]
desc = "Enter directory"

[[mgr.prepend_keymap]]
on = "<Right>"
run = ["enter", "plugin autosave"]
desc = "Enter directory"

# Yazi's default <Enter> is `open`, and its default rule for a folder is
# `{ url = "*/", use = ["edit", "open", "reveal"] }`, so the first opener wins
# and $EDITOR opens the directory instead of Yazi entering it. smart-enter
# picks `enter` for a directory and `open` for anything else.
[[mgr.prepend_keymap]]
on = "<Enter>"
run = ["plugin smart-enter", "plugin autosave"]
desc = "Enter directory, or open the file"

