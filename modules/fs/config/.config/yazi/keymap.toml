# toggle-pane.yazi: resize the panes at runtime by rewriting `mgr.ratio`.
# Both actions toggle, so the same key restores the ratio from yazi.toml.
# Binding bare `t` shadows the `t t` chord below; new tabs stay on `е е` and
# <C-t> is left free for a replacement if the Latin chord is needed again.
[[mgr.prepend_keymap]]
on = "T"
run = "plugin toggle-pane min-preview"
desc = "Hide the preview pane"

[[mgr.prepend_keymap]]
on = "t"
run = "plugin toggle-pane max-preview"
desc = "Maximize the preview pane"

[[mgr.prepend_keymap]]
on = ["у", "е"]
run = "plugin eza-preview"
desc = "Toggle tree/list dir preview"

[[mgr.prepend_keymap]]
on = ["у", "п", "ш"]
run = "plugin eza-preview toggle-git-ignore"
desc = "Toggle .gitignore files"

[[mgr.prepend_keymap]]
on = ["у", "п", "ы"]
run = "plugin eza-preview toggle-git-status"
desc = "Toggle showing git status"

