description="Terminal navigation, file discovery, file workflow, archive, and disk usage tools, including the Yazi and Midnight Commander file managers"
platforms="mac linux"
deps="media must-have"
default="off"
# Four groups are checked conditionally rather than outright:
#   - pydf is an APT-only package, and Homebrew installs GNU tar as `gtar`
#     because `tar` is a system utility on macOS;
#   - duckdb, typst, watchexec, sd, choose, and rich (rich-cli) are not packaged
#     for every Debian and Ubuntu release, so they are required on macOS only;
#   - rar and unrar are proprietary and live in non-free. setup.sh already
#     treats them as optional, and requiring them here would leave the module
#     permanently unverified wherever that component is not enabled;
#   - mermaid-ascii has no Homebrew or APT package, so setup.sh fetches the
#     upstream release binary best-effort. The myazin-mermaid-glow previewer
#     falls back to showing diagram source without it, which makes it a
#     nice-to-have rather than something worth failing the probe over.
probe='test -x "$HOME/.local/bin/glowm" && command -v eza >/dev/null && { command -v fd >/dev/null || command -v fdfind >/dev/null; } && command -v rg >/dev/null && command -v peco >/dev/null && command -v tree >/dev/null && command -v file >/dev/null && { command -v bat >/dev/null || command -v batcat >/dev/null; } && command -v stow >/dev/null && command -v entr >/dev/null && command -v glow >/dev/null && command -v jq >/dev/null && command -v yq >/dev/null && command -v mlr >/dev/null && command -v parallel >/dev/null && command -v hyperfine >/dev/null && command -v zoxide >/dev/null && command -v yazi >/dev/null && command -v ya >/dev/null && TERM="${TERM:-dumb}" mc --version 2>&1 | grep -qi "midnight commander" && command -v hexyl >/dev/null && command -v sqlite3 >/dev/null && command -v ddjvu >/dev/null && command -v transmission-show >/dev/null && command -v zip >/dev/null && command -v unzip >/dev/null && command -v zstd >/dev/null && command -v ouch >/dev/null && command -v bzip2 >/dev/null && { command -v 7z >/dev/null || command -v 7zz >/dev/null; } && command -v tar >/dev/null && { [ "$(uname -s)" != Darwin ] || command -v gtar >/dev/null; } && command -v ncdu >/dev/null && command -v dust >/dev/null && command -v duf >/dev/null && { [ "$(uname -s)" = Darwin ] || command -v pydf >/dev/null; } && { [ "$(uname -s)" != Darwin ] || { command -v duckdb >/dev/null && command -v typst >/dev/null && command -v watchexec >/dev/null && command -v sd >/dev/null && command -v choose >/dev/null && command -v rich >/dev/null; }; }'
