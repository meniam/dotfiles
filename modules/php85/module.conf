description="PHP 8.5 with FPM, the PECL extension set, and Composer, checked against version drift"
platforms="mac linux"
deps=""
default="off"
# The probe checks the interpreter's own version string rather than the name of
# a binary. On Linux every package name carries the version, but on macOS
# php@8.5 is only an alias of the unversioned php formula until 8.6 ships, so
# the interpreter is resolved through its prefix and its version is verified.
# The PECL extensions and FPM are Debian-only, so they are checked there alone.
probe='if [ "$(uname -s)" = Darwin ]; then php_bin="$(brew --prefix php@8.5 2>/dev/null)/bin/php"; else php_bin="$(command -v php8.5 2>/dev/null)"; fi; [ -x "$php_bin" ] && "$php_bin" --version 2>/dev/null | grep -q "^PHP 8\.5\." && "$php_bin" -m 2>/dev/null | grep -qx mbstring && command -v composer >/dev/null && { [ "$(uname -s)" = Darwin ] || { "$php_bin" -m 2>/dev/null | grep -qx redis && "$php_bin" -m 2>/dev/null | grep -qx pgsql && command -v php-fpm8.5 >/dev/null; }; }'
