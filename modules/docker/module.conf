description="Docker Engine/Desktop with Oxker and LazyDocker terminal interfaces"
platforms="mac linux"
deps=""
default="off"
probe='if [ "$(uname -s)" = "Darwin" ]; then [ -d /Applications/Docker.app ]; else command -v docker >/dev/null && docker compose version >/dev/null 2>&1; fi && command -v lazydocker >/dev/null && command -v oxker >/dev/null'
