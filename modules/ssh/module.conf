description="OpenSSH client defaults with connection multiplexing and an agent helper"
platforms="mac linux"
deps=""
default="on"
# The probe checks that ssh is present, that the side tools installed, that
# stow linked the defaults and the zsh agent fragment, and that setup.sh seeded
# a real ~/.ssh/config and created the ControlPath directory.
probe='command -v ssh >/dev/null && command -v ssh-keygen >/dev/null && command -v keychain >/dev/null && command -v ssh-audit >/dev/null && command -v sshuttle >/dev/null && command -v autossh >/dev/null && test -f "$HOME/.ssh/config" && test ! -L "$HOME/.ssh/config" && test -L "$HOME/.ssh/config.d/zz-defaults.conf" && test -d "$HOME/.ssh/sockets" && test -L "${XDG_CONFIG_HOME:-$HOME/.config}/zsh/35-ssh-agent.zsh"'
