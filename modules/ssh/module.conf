description="OpenSSH client defaults with connection multiplexing"
platforms="mac linux"
deps=""
default="on"
# The module ships configuration only, so the probe checks that ssh is present,
# that stow linked the config, and that setup.sh created the socket directory
# the ControlPath points at.
probe='command -v ssh >/dev/null && test -L "$HOME/.ssh/config" && test -d "$HOME/.ssh/sockets"'
