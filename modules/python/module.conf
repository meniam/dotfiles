description="Python toolchain managed by uv, with Ruff, mypy, ty, and the usual project tools"
platforms="mac linux"
deps=""
default="off"
# ty is deliberately absent from the probe. It is an upstream preview release,
# setup.sh only warns when it cannot be installed, and requiring it here would
# leave the module permanently unverified over a tool that is not load-bearing.
probe='command -v uv >/dev/null && command -v uvx >/dev/null && command -v ruff >/dev/null && command -v mypy >/dev/null && command -v pre-commit >/dev/null && command -v ipython >/dev/null && command -v pip-audit >/dev/null && command -v nox >/dev/null && uv python list --only-installed --managed-python 2>/dev/null | grep -q .'
