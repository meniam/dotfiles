description="Python toolchain managed by uv, with the Ruff linter and the ty type checker"
platforms="mac linux"
deps=""
default="off"
probe='command -v uv >/dev/null && command -v uvx >/dev/null && command -v ruff >/dev/null && command -v ty >/dev/null && uv python list --only-installed --managed-python 2>/dev/null | grep -q .'
