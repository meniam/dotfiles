# Default applications for filename extensions, applied by setup.sh.
#
# Format: one `extension<TAB>bundle-id` line, without the leading dot. `#`
# starts a comment. Bundle IDs are written in lower case, which is the form
# Finder itself stores.
#
# This file exists because duti cannot express these bindings. duti resolves an
# extension to its type identifier and assigns a handler for that type, and the
# extensions below have no type of their own: macOS generates one from the
# extension, and LaunchServices refuses a handler for a generated identifier
# with `error -50`. What Finder's `Change All…` writes instead is an entry keyed
# by the extension itself, in
# ~/Library/Preferences/com.apple.LaunchServices/com.apple.launchservices.secure.plist,
# and that is what setup.sh adds here.
#
# Two consequences of storing preferences macOS owns: a major system upgrade may
# reset them, and an entry already present with a different application is left
# alone rather than overwritten, so a choice made in Finder is not silently
# reverted. Remove the entry there to let this file take over again.

# React, Sass, and Twig sources, which editors claim by extension in their own
# Info.plist rather than by declaring a type. A `*.twig.html` template is out of
# reach here: LaunchServices only sees `html`, which belongs to the browser.
jsx	com.microsoft.vscode
tsx	com.microsoft.vscode
sass	com.microsoft.vscode
scss	com.microsoft.vscode
twig	com.microsoft.vscode

# Environment files. `env` covers `.env`; `local` is what LaunchServices sees for
# `.env.local`, since only the last extension of a file name counts — every
# other `*.local` file, such as `~/.ssh/config.local`, follows it into the
# editor.
env	com.microsoft.vscode
local	com.microsoft.vscode
