# Quick shell toggled by cmd+j (see conf.d/04-map.conf): a small translucent
# panel floating over the current kitty window, so the terminal underneath
# stays readable while typing in the panel. Running the kitten again hides it.

# Centered box of the given size instead of a strip along a screen edge.
edge center-sized
lines 20
columns 100

# Low enough to read the terminal underneath through the panel.
background_opacity 0.7

# Let a click on the main window take focus, to select text there, without
# hiding the panel.
focus_policy on-demand

# The panel reads kitty.conf, so without this it would replay startup.session
# and start Herdr. Open a plain bash instead.
kitty_override startup_session none
kitty_override shell bash
