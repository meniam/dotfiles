# Window and opacity

allow_remote_control yes
listen_on unix:/tmp/kitty
enabled_layouts splits,stack

remember_window_size  no
initial_window_width  215c
initial_window_height 66c
remember_window_position yes

# titlebar-and-corners also drops the macOS window shadow, matching WezTerm's
# MACOS_FORCE_DISABLE_SHADOW.
hide_window_decorations titlebar-and-corners

confirm_os_window_close 0

# Window opacity over a 30-radius macOS blur behind the window, the same stack
# WezTerm uses.
background_opacity 0.9
dynamic_background_opacity yes
background_blur 30

window_padding_width 0

# A plain start of kitty runs Herdr in its first tab through the session file
# next to this configuration. Herdr attaches to its background session, so a
# repeated start reattaches instead of starting over, and the tab falls back
# to a shell when Herdr exits. A window opened with cmd+n runs the shell as
# before.
startup_session startup.session
