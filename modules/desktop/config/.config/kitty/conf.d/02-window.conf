# Window and opacity

allow_remote_control yes
listen_on unix:/tmp/kitty
enabled_layouts splits,stack

remember_window_size  no
initial_window_width  215c
initial_window_height 66c
remember_window_position yes

# titlebar-and-corners also drops the macOS window shadow, matching WezTerm's
# MACOS_FORCE_DISABLE_SHADOW.
hide_window_decorations titlebar-and-corners

confirm_os_window_close 0

# Same background stack as WezTerm: 0.85 window opacity over a 30-radius
# macOS blur behind the window.
background_opacity 0.85
dynamic_background_opacity yes
background_blur 30

# WezTerm window_padding = 12 on every side
window_padding_width 12
