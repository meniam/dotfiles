description="macOS-specific command-line tools, desktop software, system defaults, and default application handlers, including Hammerspoon, WezTerm, and Kitty"
platforms="mac"
deps="must-have git media fs"
default="on"
# The probe checks the installed software and the stowed duti payload. It
# deliberately does not read back the system defaults this module writes:
# changing one of them in System Settings afterwards is a legitimate thing to do
# and must not make the module report itself as not installed.
probe='command -v fetch >/dev/null && command -v gpg >/dev/null && command -v pkg-config >/dev/null && command -v dockutil >/dev/null && command -v duti >/dev/null && command -v mas >/dev/null && test -d /Applications/Hammerspoon.app && command -v wezterm >/dev/null && command -v kitty >/dev/null && test -L "$HOME/.config/duti/settings.duti"'
