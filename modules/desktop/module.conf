description="macOS-specific command-line tools and desktop software, including Hammerspoon, WezTerm, and Kitty"
platforms="mac"
deps="must-have docker git media fs nvim"
default="on"
probe="command -v fetch >/dev/null && command -v gpg >/dev/null && command -v pkg-config >/dev/null && test -d /Applications/Hammerspoon.app && command -v wezterm >/dev/null && command -v kitty >/dev/null"
