# URL shorthands.
#
# Two prefixes per host: `gh:`/`gst:` clone over SSH, `github:`/`gist:` clone
# anonymously over HTTPS but push over SSH, so a read-only clone can still be
# pushed from without editing its remote.
#
# The anonymous side used to be `git://`, which GitHub shut down in 2022. The
# rewrite is kept for any remote still recorded with that scheme, so an old
# clone fetches over HTTPS instead of hanging on a dead port.

[url "git@github.com:"]
    insteadOf = "gh:"
    pushInsteadOf = "github:"
    pushInsteadOf = "git://github.com/"

[url "https://github.com/"]
    insteadOf = "github:"
    insteadOf = "git://github.com/"

[url "git@gist.github.com:"]
    insteadOf = "gst:"
    pushInsteadOf = "gist:"
    pushInsteadOf = "git://gist.github.com/"

[url "https://gist.github.com/"]
    insteadOf = "gist:"
    insteadOf = "git://gist.github.com/"
