[pull]
    ff = only

[apply]
    # Detect whitespace errors when applying a patch.
    whitespace = fix

[branch]
    # Show most recently changed branches first.
    sort = -committerdate

[tag]
    # Sort tags by semantic version rather than lexicographically,
    # newest first. Without this `git tags` claims v1.10 < v1.9.
    sort = -version:refname

[column]
    # Lay list output (branches, tags, status) out in columns when it fits.
    ui = auto

[core]
    # Use the module's global ignore/attributes files.
    excludesfile = ~/.config/git/.gitignore
    attributesfile = ~/.config/git/.gitattributes

    # Treat spaces before tabs and all kinds of trailing whitespace as an error.
    # [default] trailing-space: looks for spaces at the end of a line
    # [default] space-before-tab: looks for spaces before tabs at the beginning of a line
    whitespace = space-before-tab,-indent-with-non-tab,trailing-space

    # Make `git rebase` safer on macOS.
    # More info: <http://www.git-tower.com/blog/make-git-rebase-safe-on-osx/>
    trustctime = false

    # Prevent showing files whose names contain non-ASCII symbols as unversioned.
    # macOS hands out filenames in NFD; `true` records them as NFC, which is what
    # every other platform uses. This has to be `true` for the effect described
    # above — `false` is what causes the duplicate/unversioned-file symptom.
    # http://michael-kuehnel.de/git/2014/11/21/git-mac-osx-and-german-umlaute.html
    precomposeunicode = true

    # Speed up commands involving untracked files such as `git status`.
    # https://git-scm.com/docs/git-update-index#_untracked_cache
    untrackedCache = true
    autocrlf = input

[commit]
    # Show the staged diff in the commit message editor. `git ca` relies on this.
    # Signing configuration lives in signing.conf.
    verbose = true

[blame]
    # `blame.ignoreRevsFile = .git-blame-ignore-revs` is deliberately NOT set
    # here. The setting is global, but the file is per repository, and Git
    # aborts on a missing one:
    #
    #   fatal: could not open object name list: .git-blame-ignore-revs
    #
    # One such config line therefore breaks `git blame` in every repository
    # that does not ship the file. The `bl` alias in aliases.conf passes
    # `--ignore-revs-file` per invocation instead, and only when the repository
    # actually has a `.git-blame-ignore-revs` at its root — which is what keeps
    # a mass reformat from swallowing blame.
    #
    # The two marks below only appear once revisions are being ignored: `?` for
    # a line whose blame was pushed to the ignored commit's parent and is
    # therefore a guess, `*` for one that could not be attributed at all.
    # Annotation colours live in color.conf.
    markIgnoredLines = true
    markUnblamableLines = true

[help]
    # Show the suggested command for a mistyped one, but never run it
    # unprompted — some aliases here are destructive.
    # Git >= 2.42 also accepts `prompt`, older versions do not.
    autocorrect = 0

[merge]
    # Include summaries of merged commits in newly created merge commit messages
    log = true

[rerere]
    # Record how a conflict was resolved and replay that resolution when the
    # same conflict shows up again. Pays for itself on any rebase-heavy branch.
    enabled = true

[rebase]
    # Apply `fixup!`/`squash!` markers automatically. `git fix` + `git reb` rely
    # on this.
    autosquash = true

    # Stash dirty changes before rebasing and restore them afterwards.
    autostash = true

    # Retarget branches that pointed into the rewritten range instead of
    # leaving them behind on the old commits (stacked branches).
    updateRefs = true

[fetch]
    # Drop remote-tracking refs and tags that no longer exist upstream,
    # so `git branches` and `git tags` do not accumulate dead entries.
    prune = true
    pruneTags = true

[push]
    # https://git-scm.com/docs/git-config#git-config-pushdefault
    default = simple
    # Make `git push` push relevant annotated tags when pushing branches out.
    followTags = true
    # Let a plain `git push` publish a new local branch without `-u`.
    autoSetupRemote = true

[init]
    defaultBranch = main
