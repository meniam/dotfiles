### Commit and tag signing with an SSH key.
#
# The SSH backend needs no gnupg: the signing key is an ordinary SSH keypair
# and the verification side is a plain text file. Only the *format* is
# configured here. The key path and the allowed-signers list both name a
# person, so neither belongs in this repository — see the per-machine snippet
# below.
#
# Signing is off by default on purpose. `commit.gpgsign = true` without a key
# makes every commit on a fresh machine fail with
#
#   fatal: either user.signingkey or gpg.ssh.defaultKeyCommand needs to be configured
#
# so it is enabled next to the key, in one of the gitignored files.
#
# Per machine, in ~/.config/git/personal.conf (or work.conf, or
# ~/.gitconfig.local):
#
#   [user]
#       email = you@example.com
#       # Public half; the private key stays where ssh-agent can reach it.
#       signingkey = ~/.ssh/id_ed25519.pub
#   [commit]
#       gpgsign = true
#   [tag]
#       gpgSign = true
#
# and one allowed-signers line per identity, so verification can name a signer:
#
#   echo "you@example.com $(cat ~/.ssh/id_ed25519.pub)" >> ~/.config/git/allowed_signers
#
# On the forge side the same public key has to be registered as a *signing*
# key. GitHub keeps authentication keys and signing keys apart even when the
# bytes are identical: an auth-only key leaves commits Unverified.

[gpg]
    # `ssh` instead of the default `openpgp`. `git verify-commit` and
    # `git log --show-signature` then shell out to ssh-keygen -Y.
    format = ssh

[gpg "ssh"]
    # Who Git is willing to name when verifying a signature. Without it a
    # valid signature still reports "No principal matched". Git never creates
    # the file, and a missing one degrades verification only — signing and
    # committing keep working.
    allowedSignersFile = ~/.config/git/allowed_signers
