### Colour scheme for Git's own output.
#
# Design rules for this file:
#
#   1. Only the 8 basic colour *names* (red, green, yellow, blue, magenta,
#      cyan, white, black) plus attributes (bold, dim, ul, italic, reverse,
#      strike). Those names are indexes into the terminal palette, so they
#      follow the terminal theme automatically and keep working when the
#      terminal switches between light and dark.
#   2. No `#rrggbb` literals. Besides pinning the colours to one theme, `#`
#      starts a comment in Git config, so a hex value MUST be quoted
#      (`old = "#ff5555"`) or Git silently reads an empty value.
#   3. Semantic consistency across commands: staged/ours is green, unstaged
#      and remote-tracking is red, informational is cyan, warnings yellow.
#
# Diff *content* colours live in delta.conf — delta is the pager and does its
# own painting; the `[color "diff"]` block below is only the fallback for
# `git --no-pager diff`, pipes and `--color=always`.

[color]
    # Colourise when writing to a terminal. This is the default since Git
    # 1.8.4, kept explicit so the intent is documented rather than inherited.
    ui = auto

[color "advice"]
    # "hint: ..." lines Git prints to explain what to do next.
    hint = yellow

[color "branch"]
    current = green bold
    local = yellow
    # Remote-tracking branches are red everywhere else in Git (status short
    # format, log --decorate), so `git branch -a` matches instead of using
    # green, which reads as "good/local".
    remote = red
    upstream = cyan
    plain = normal

[color "status"]
    header = dim white
    # `added`/`updated` is the staged section — green, matching every other
    # "this is committed-ready" signal. `changed` is the unstaged section, so
    # it is red. The previous values had these two the other way round.
    added = green
    changed = red
    untracked = cyan
    unmerged = red bold
    nobranch = red bold
    branch = cyan bold
    localBranch = green
    remoteBranch = red

[color "decorate"]
    # `git log --oneline --decorate` ref labels.
    HEAD = cyan bold
    branch = green bold
    remoteBranch = red
    tag = yellow bold
    stash = magenta
    grafted = dim white

[color "diff"]
    # Fallback only: delta repaints all of this when it is in the pipeline.
    meta = yellow bold
    # Hunk header (@@ ... @@) and the function name inside it.
    frag = magenta bold
    func = cyan
    context = normal
    old = red
    new = green
    commit = yellow
    # Pairs with core.whitespace in core.conf: `reverse` makes trailing space
    # and space-before-tab visible as coloured blocks rather than nothing.
    whitespace = red reverse

    # Moved-line detection (diff.colorMoved in diff.conf). Kept to two
    # colours so delta's map-styles can translate them 1:1 — see delta.conf.
    oldMoved = bold magenta
    newMoved = bold cyan

[color "grep"]
    filename = magenta
    lineNumber = green
    column = green
    # `match` sets both matchContext and matchSelected at once.
    match = red bold
    function = cyan
    separator = dim white
    selected = normal
    context = normal

[color "interactive"]
    # `git add -i/-p`, `git clean -i`.
    prompt = cyan bold
    header = yellow bold
    help = dim white
    error = red bold

[color "remote"]
    # Git 2.24+: highlights the leading keyword in messages relayed from the
    # remote (server-side hooks, GitHub/GitLab push output).
    hint = yellow
    warning = yellow bold
    success = green bold
    error = red bold

[color "push"]
    # Git 2.36+.
    error = red bold

[color "transport"]
    # Git 2.36+: shown when a push is rejected.
    rejected = red bold

[blame]
    # `repeatedLines` and `highlightRecent` are mutually exclusive; only one
    # can be the default. `highlightRecent` (age-based) is the more useful of
    # the two day to day — `git blame --color-lines` still gives the other on
    # demand.
    #
    # This wins over delta's own `blame-palette`: Git colours the annotation
    # column itself and delta only syntax-highlights the code after it. Drop
    # this line if you would rather have delta's per-commit colour rotation.
    coloring = highlightRecent

[color "blame"]
    # Oldest -> newest. Format is colour, date, colour, date, ..., colour.
    highlightRecent = dim white, 1 year ago, white, 1 month ago, yellow, 1 week ago, red bold
    # Used by `git blame --color-lines` for annotations repeating the commit
    # of the preceding line.
    repeatedLines = dim white
