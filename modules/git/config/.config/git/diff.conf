[diff]
    # Detect copies as well as renames.
    renames = copies

    # Produce noticeably more readable hunks than the default Myers algorithm,
    # especially for reindented or reordered blocks.
    algorithm = histogram

    # Paint lines that only moved in a different colour from real additions
    # and deletions — makes a pure-refactor diff readable at a glance.
    #
    # `blocks` (not `zebra`) on purpose: zebra alternates between two colour
    # pairs to separate adjacent moved blocks, which would need a four-way
    # translation in delta's map-styles. `blocks` uses exactly oldMoved and
    # newMoved, so the mapping in delta.conf is 1:1 and cannot drift.
    colorMoved = blocks

    # A block that only changed indentation still counts as moved, so
    # re-indenting a function does not show up as rewritten.
    colorMovedWS = allow-indentation-change

[diff "bin"]
    # Use `hexdump` to diff binary files.
    textconv = hexdump -v -C
