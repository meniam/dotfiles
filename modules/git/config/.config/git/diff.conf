[diff]
    # Detect copies as well as renames.
    renames = copies

    # Produce noticeably more readable hunks than the default Myers algorithm,
    # especially for reindented or reordered blocks.
    algorithm = histogram

    # Moved-line colouring is deliberately NOT enabled globally.
    #
    # It pays off on a hand-written refactor (a function that only changed
    # position stops looking rewritten) but produces noise on generated files
    # with repetitive boilerplate. In a phpstan baseline, `count: 1` and
    # `identifier: argument.type` occur thousands of times, so the detector
    # matches them from anywhere and a single deletion block comes out striped
    # — runs of "moved" lines broken up by the one unique `message:` line.
    #
    # Turn it on per command when reviewing an actual refactor:
    #
    #   git show --color-moved=blocks --color-moved-ws=allow-indentation-change <ref>
    #
    # To make it global again, uncomment both lines below; the matching
    # `map-styles` translation in delta.conf is already in place.
    #
    # `blocks` rather than `zebra` because zebra alternates between two colour
    # pairs, which needs a four-way translation in delta's map-styles, while
    # `blocks` uses exactly oldMoved/newMoved and maps 1:1.
    #colorMoved = blocks
    #colorMovedWS = allow-indentation-change

[diff "bin"]
    # Use `hexdump` to diff binary files.
    textconv = hexdump -v -C
