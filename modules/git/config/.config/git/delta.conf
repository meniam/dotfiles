### delta — syntax-highlighting pager for diffs.
#
# delta repaints diff output itself, so `[color "diff"]` in color.conf is only
# a fallback for `git --no-pager diff`. Everything about how a diff *looks*
# interactively is configured here.
#
# Same theme-agnostic rule as color.conf: `syntax-theme = ansi` makes delta
# use the terminal's 16 colours instead of a hardcoded palette, so diffs stay
# readable when the terminal flips between light and dark.
#
# minus/plus background styles are deliberately left unset so delta picks its
# own. Those defaults are truecolor and tuned for a dark background — delta
# assumes dark unless told otherwise, so on a light terminal add
# `light = true` below rather than hand-picking backgrounds here.

[core]
    pager = delta

[interactive]
    # `git add -p` feeds single hunks through this filter. Side-by-side and
    # line numbers are wrong there (the hunk is already narrow and Git owns
    # the line accounting), so the `interactive` feature turns them off.
    diffFilter = delta --color-only --features=interactive

[delta]
    navigate = true
    side-by-side = true
    line-numbers = true
    hyperlinks = true

    # Terminal-palette syntax highlighting; survives light/dark switching.
    # Swap for a named theme (`Nord`, `GitHub`, ...) to get richer colours at
    # the cost of pinning to one terminal background.
    syntax-theme = ansi

    # Keep `+`/`-` in the gutter: colour alone is lost when output is copied
    # out of the terminal or read over a screen share.
    keep-plus-minus-markers = true

    file-style = yellow bold
    file-decoration-style = yellow ul
    hunk-header-style = file line-number syntax
    hunk-header-decoration-style = magenta box

    line-numbers-left-style = dim white
    line-numbers-right-style = dim white
    line-numbers-minus-style = red
    line-numbers-plus-style = green
    line-numbers-zero-style = dim white

    # With side-by-side on, long lines wrap instead of being truncated.
    wrap-max-lines = 2
    tabs = 4

    # Translates the moved-line colours Git emits for diff.colorMoved into
    # delta styles. Left-hand side must match `[color "diff"]
    # oldMoved/newMoved` in color.conf. Inert unless moved detection is on —
    # diff.conf keeps it off globally, so this applies when `--color-moved` is
    # passed on the command line.
    #
    # Foreground-only on purpose. delta's documented example (`syntax
    # magenta`) sets a *background*, which lands on top of the red/green
    # add/remove background and produces unreadable double-striped lines. A
    # moved line is not a real change, so it should recede: dim italic text,
    # no fill. Magenta vs cyan still says old-copy vs new-copy, and
    # keep-plus-minus-markers keeps the gutter readable.
    map-styles = bold magenta => magenta dim italic, bold cyan => cyan dim italic

    # `git blame` through delta: syntax-highlight the source after the
    # annotation column. delta's `blame-palette` is intentionally not set —
    # `blame.coloring` in color.conf already owns the annotation colours.
    blame-code-style = syntax

    # Conflict markers rendered as two labelled diffs instead of raw
    # <<<<<<< / ======= / >>>>>>> soup. Pairs with merge.conflictStyle below.
    merge-conflict-begin-symbol = ▼
    merge-conflict-end-symbol = ▲
    merge-conflict-ours-diff-header-style = yellow bold
    merge-conflict-theirs-diff-header-style = yellow bold

[delta "interactive"]
    side-by-side = false
    line-numbers = false

[merge]
    # zdiff3 shows the common ancestor and hoists shared lines out of the
    # conflicting hunks — strictly more information than the default `merge`.
    conflictStyle = zdiff3
