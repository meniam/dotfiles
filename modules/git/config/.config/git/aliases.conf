# Git aliases.
#
# Conventions:
#   - single-letter aliases are the ones typed dozens of times a day;
#   - anything taking positional arguments is wrapped in `!f() { ...; }; f`
#     with every argument quoted, so values containing spaces survive;
#   - a few aliases rely on settings from `core.conf` (`rebase.autosquash`,
#     `commit.verbose`, `tag.sort`); the comments below say which.

[pretty]
    # One-line commit format shared by the log aliases below:
    # SHA, date, subject, author, ref names.
    brief = tformat:%C(yellow)%h %C(blue)%ad %C(reset)%s %C(green)[%an]%C(red)%d%C(reset)

[alias]

    #--- Inspect ------------------------------------------------------------

    # Short working tree status, including branch and upstream tracking.
    s = status -sb

    # History graph of the latest 20 commits on the current branch.
    l = log -n 20 --graph --date=short --pretty=brief

    # Same, but across every ref and with no commit limit.
    lg = log --graph --all --date=short --pretty=brief

    # Diff the working tree against the last commit, with a per-file summary.
    d = diff --patch-with-stat

    # `git di 3` diffs the working tree against the state 3 commits ago.
    di = "!f() { git diff --patch-with-stat \"HEAD~${1:-1}\"; }; f"

    # Show the last commit together with its diffstat.
    last = show --stat HEAD

    # Blame ignoring whitespace and following code moved within and across files.
    bl = blame -w -C -C -C

    # Print the absolute path of the repository root.
    root = rev-parse --show-toplevel

    # Entity-level semantic diff via sem-cli; accepts `git diff` syntax.
    sdiff = "!f() { command -v sem >/dev/null || { echo 'sdiff: sem-cli is not installed' >&2; exit 1; }; sem diff \"$@\"; }; f"

    #--- Commit -------------------------------------------------------------

    # Stage every change, including deletions, and commit.
    # Shows the staged diff in the editor via `commit.verbose` in core.conf.
    ca = !git add -A && git commit

    # Fold the staged changes into the last commit, keeping its message.
    amend = commit --amend --no-edit

    # Re-edit the message of the last commit without changing its content.
    reword = commit --amend

    # Reassign authorship of the last commit: `git credit "Name" mail@example.com`.
    credit = "!f() { git commit --amend --author \"$1 <$2>\" --no-edit; }; f"

    # Mark a commit as a fixup for $1; squashed automatically by `git reb`.
    fix = "!f() { git commit --fixup \"$1\"; }; f"

    # Undo the last commit, keeping its changes staged.
    undo = reset --soft HEAD~1

    # Unstage the given paths without touching the working tree.
    unstage = restore --staged

    # Stash everything, including untracked files.
    wip = stash push --include-untracked

    #--- Branch -------------------------------------------------------------

    # Switch to a branch: an existing local one, a new local branch tracking
    # `origin/$1`, or a brand new branch off HEAD. Unlike a `switch || switch -c`
    # fallback this never hides the real error behind a suppressed stderr.
    go = "!f() { if git rev-parse --verify --quiet \"refs/heads/$1\" >/dev/null || git rev-parse --verify --quiet \"refs/remotes/origin/$1\" >/dev/null; then git switch \"$1\"; else git switch -c \"$1\"; fi; }; f"

    # List local and remote branches with upstream tracking and last commit.
    branches = branch --all -vv

    # Name of the remote's default branch, falling back to `main`.
    defbranch = "!f() { b=$(git symbolic-ref --short refs/remotes/origin/HEAD 2>/dev/null); b=\"${b#origin/}\"; echo \"${b:-main}\"; }; f"

    # Delete every local branch already merged into the default branch.
    # a.k.a. "delete merged". Never touches main/master/dev or checked-out branches.
    dm = "!f() { git branch --merged \"$(git defbranch)\" | grep -vE '^[*+]|^[[:space:]]*(main|master|dev)$' | xargs -r -n1 git branch -d; }; f"

    #--- Rebase and history rewriting ---------------------------------------

    # Interactively rebase the last $1 commits (default 10).
    # Applies fixup/squash markers via `rebase.autosquash` in core.conf.
    reb = "!f() { git rebase -i \"HEAD~${1:-10}\"; }; f"

    # Push the rewritten branch, refusing to discard upstream commits we never saw.
    pf = push --force-with-lease --force-if-includes

    #--- Search -------------------------------------------------------------

    # Find commits whose diff adds or removes the given string.
    fc = "!f() { git log --pretty=brief --date=short -S\"$1\"; }; f"

    # Find commits whose message matches the given pattern.
    fm = "!f() { git log --pretty=brief --date=short --grep=\"$1\"; }; f"

    # Find branches containing the given commit.
    fb = "!f() { git branch --all --contains \"$1\"; }; f"

    # Find the nearest tag containing the given commit.
    ft = "!f() { git describe --always --contains \"$1\"; }; f"

    #--- Remotes and tags ---------------------------------------------------

    # Pull remote changes for this repository and all its submodules.
    p = pull --recurse-submodules

    # Clone a repository including all its submodules.
    c = clone --recurse-submodules

    # List tags, newest version first via `tag.sort` in core.conf.
    tags = tag -l

    # Show remotes with their fetch and push URLs.
    remotes = remote --verbose

    # Move an existing tag to the current commit, locally and on origin.
    retag = "!f() { git tag -f \"$1\" && git push --force origin \"refs/tags/$1\"; }; f"

    #--- Meta ---------------------------------------------------------------

    # List every configured alias.
    aliases = config --get-regexp ^alias

    # List contributors by commit count.
    contributors = shortlog --summary --numbered

    # Show the user email configured for this repository.
    whoami = config user.email
