description="Git and GitHub command-line tooling, including the Lazygit and Tig terminal interfaces and delta"
platforms="mac linux"
# urls.conf rewrites the `gh:` and `gst:` shorthands to git@github.com, and
# signing.conf selects the SSH signature backend, so both remote access and
# `git verify-commit` go through OpenSSH. A minimal Debian image has no
# openssh-client, which the ssh module installs.
deps="ssh"
default="on"
probe="command -v git >/dev/null && command -v gh >/dev/null && command -v git-lfs >/dev/null && command -v delta >/dev/null && command -v tig >/dev/null && lazygit --version >/dev/null"
