description="Git and GitHub command-line tooling, including the Lazygit and Tig terminal interfaces and delta"
platforms="mac linux"
deps=""
default="on"
probe="command -v git >/dev/null && command -v gh >/dev/null && command -v git-lfs >/dev/null && command -v delta >/dev/null && command -v tig >/dev/null && lazygit --version >/dev/null"
